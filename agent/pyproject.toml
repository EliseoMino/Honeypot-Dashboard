[project]
name = "honeypot-agent"
version = "0.1.0"
description = "Log shipping agent that tails Cowrie cowrie.json and ships it to the backend over TLS 1.3"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# paramiko is here only for scripts/simulate-attack.py, the development tool that
# drives the honeypot. It is deliberately not a runtime dependency of the agent.
dev = [
    "paramiko>=3.4",
    "pytest>=8.0",
]

[project.scripts]
honeypot-agent = "honeypot_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/honeypot_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
