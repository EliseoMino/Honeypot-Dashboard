[project]
name = "honeypot-backend"
version = "0.1.0"
description = "Ingestion, normalization and API layer for Honeypot-Dashboard"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "cryptography>=42.0",
]

[project.scripts]
honeypot-backend = "honeypot_backend.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/honeypot_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
