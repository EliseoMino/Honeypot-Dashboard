# Mutual TLS hop towards the ingestion API.
#
# Included by every location that forwards to the backend, so the transport is
# configured in exactly one place. nginx presents the `proxy` client
# certificate, which the backend verifies against the development CA, and
# verifies the backend certificate the same way in the other direction. The
# upstream is HTTP/1.1 on purpose: the API is a plain JSON service and the
# backend uses a dedicated TLS termination context.
#
# Included from a location block that already sets proxy_pass.

proxy_http_version 1.1;
proxy_set_header Connection "";

# Identify the real caller to the API and keep the scheme the browser used.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;

# Verify the backend. `backend` is a SAN of the server certificate, so the
# connection is checked against the real identity of the service.
proxy_ssl_server_name on;
proxy_ssl_name backend;
proxy_ssl_protocols TLSv1.3;
proxy_ssl_verify on;
proxy_ssl_verify_depth 2;
proxy_ssl_trusted_certificate /certs/ca.crt;

# Present our own client certificate: the backend requires one.
proxy_ssl_certificate /certs/proxy.crt;
proxy_ssl_certificate_key /certs/proxy.key;

# The upstream keeps connections open between batches, so a server restart
# should not fail the requests already in flight.
proxy_next_upstream error timeout http_502 http_503 http_504;
