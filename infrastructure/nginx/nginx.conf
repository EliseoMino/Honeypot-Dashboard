# Dashboard front end and the only path to the ingestion API.
#
# The browser cannot talk to the backend directly: the backend requires a client
# certificate (RF-01) and a browser has nowhere to put a private key. nginx
# closes that gap. It holds the `proxy` client certificate, so the browser only
# ever speaks plain HTTP to this container and the mutual TLS hop happens here.
#
# The certificate material is mounted read only from var/certs by the compose
# file. The mutual TLS directives live in honeypot-proxy.conf so that they are
# written once and every forwarded route is provably configured the same way.

upstream backend_api {
    # The service name is also a certificate SAN, so the server identity is
    # verified below with proxy_ssl_name.
    server backend:8443;
    keepalive 8;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A batch of Cowrie events is the largest request the API accepts, so this
    # is generous; it only stops a runaway upload from filling the spool volume.
    client_max_body_size 8m;

    # The health probes go through the same proxy path a browser uses, so a
    # green dashboard also means the backend answers over mutual TLS.
    location = /healthz {
        proxy_pass https://backend_api;
        include /etc/nginx/honeypot-proxy.conf;
    }

    location = /readyz {
        proxy_pass https://backend_api;
        include /etc/nginx/honeypot-proxy.conf;
    }

    # `^~` matters: without it a request such as /api/v1/report.json would match
    # the static asset regex below and be served from disk instead of forwarded.
    location ^~ /api/ {
        proxy_pass https://backend_api;
        include /etc/nginx/honeypot-proxy.conf;

        # Ingestion keeps answering while the database is down, but a queued
        # batch can take a while, so these are more generous than the defaults.
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # A single page application: anything that is not a file is a route, not a
    # missing asset. The exact API prefixes above win over this prefix match.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is not content hashed, so caching it would keep serving the
    # previous bundle after a rebuild.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Everything else the build emits is content hashed and can be cached
    # indefinitely.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
