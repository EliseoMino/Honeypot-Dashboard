# Operator configuration for the Cowrie honeypot.
#
# Cowrie loads its settings in layers: this file only has to contain the values
# that differ from the bundled defaults in
# src/cowrie/data/etc/cowrie.cfg.dist. Copying the whole distribution file here
# would freeze the defaults at this version and silently ignore every future
# upstream change, so only overrides belong in this file.
#
# The compose file mounts this single file at /cowrie/cowrie-git/etc/cowrie.cfg.
# Mounting the whole etc/ directory instead would hide the files the image
# expects to find there.

[honeypot]
# Log directory, relative to the Cowrie working directory. The agent tails
# ${log_path}/cowrie.json, which with this value is
# /cowrie/cowrie-git/var/log/cowrie/cowrie.json. The compose file mounts the
# host directory infrastructure/cowrie/data at /cowrie/cowrie-git/var, so the
# JSON log, the downloaded artefacts, the tty logs and the SSH host keys all
# land under that one host directory.
log_path = var/log/cowrie

# Normalised timestamps. RFC 3339 with a trailing Z is what the backend parses;
# an epoch number would be accepted too, but it hides the honeypot's timezone
# from anyone reading the file.
timezone = UTC

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
# Disabled by default upstream. Telnet is enabled here because a honeypot that
# answers on 22/23 collects the Mirai style scans that never touch SSH. The port
# is published on the loopback interface only, see compose.yaml.
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

# Structured output consumed by the ingestion agent. This is the only output the
# agent reads: RF-01 rules out cowrie.log, and the plain text log is not
# structured.
#
# The section name is `output_jsonlog` in Cowrie 3.x. The older `output_json`
# with a `file` key belongs to Cowrie 2.x and is silently ignored here, which
# would leave the agent with no file to tail.
[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false

# Left at the bundled defaults on purpose, so the honeypot keeps writing
# cowrie.log and the tty transcripts for manual investigation. They are ignored
# by the agent and never committed.
