# Local development stack for Honeypot-Dashboard.
# VPS deployment is intentionally out of scope for this phase.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cowrie:
    image: ${COWRIE_IMAGE:-destruct/cowrie}
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "${COWRIE_SSH_PORT:-2222}:2222"
      - "${COWRIE_TELNET_PORT:-2223}:2223"
    volumes:
      - ./infrastructure/cowrie/data:/opt/cowrie/var/cowrie
      - ./infrastructure/cowrie/etc:/opt/cowrie/etc

volumes:
  pgdata:
